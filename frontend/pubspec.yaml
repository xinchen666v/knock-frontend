name: knock
description: A minimal peer-to-peer chat client built on the knock protocol
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  cryptography: ^2.9.0
  crypto: ^3.0.8
  sqlite3: ^3.9.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true